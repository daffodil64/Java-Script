<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSON Data Loader - Daffofil Tembhurkar</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>Student Data</h1>

        <p class="subtitle">
            Load JSON Data using fetch() and jQuery $.getJSON()
        </p>

        <div class="buttons">

            <button onclick="loadUsingFetch()">
                Load using fetch()
            </button>

            <button onclick="loadUsingJQuery()">
                Load using $.getJSON()
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <tr>
                        <td colspan="4">
                            Click a button to load student data
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

        <footer>
            Created by <strong>Daffodil Tembhurkar</strong>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
